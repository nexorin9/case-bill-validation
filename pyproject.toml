[project]
name = "case-bill-validation"
version = "0.1.0"
description = "病案结算清单核验系统：把出院小结/病案首页贴进浏览器，自动给出 193 项字段级合规标记与原文引用，结算员确认后一键导出结算清单 Excel 并回写病案系统。"
requires-python = ">=3.11"
authors = [{ name = "ChaosForge Contributors" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "pypdf2>=3.0.1",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "python-dotenv>=1.0.1",
    "sse-starlette>=2.0.0",
    "jsonschema>=4.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.1",
    "playwright>=1.42.0",
]

[project.scripts]
case-bill-validation = "case_bill_validation.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["case_bill_validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
markers = [
    "slow: marks tests as slow (deselected with -m 'not slow')",
]